version: '3.8'

services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog_redis_cache
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - catalog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog_service_api
    restart: always
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8002
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=catalog-db
      - DB_PORT=5432
      - DB_NAME=catalog_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=catalog-redis
      - REDIS_PORT=6379
      - JWT_SECRET=development-secret-key-change-in-production-never-commit-real-secrets
      - KAFKA_ENABLED=false
    ports:
      - "8002:8002"

volumes:
  catalog_pg_data:
  catalog_redis_data:
