version: '3.8'

services:
  user-db:
    image: postgres:16-alpine
    container_name: user_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-redis:
    image: redis:7-alpine
    container_name: user_redis_cache
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - user_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_service_api
    restart: always
    depends_on:
      user-db:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    environment:
      - PORT=8001
      - ENVIRONMENT=production
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=user_db
      - DB_SSLMODE=disable
      - REDIS_HOST=user-redis
      - REDIS_PORT=6379
      - JWT_SECRET=development-secret-key-change-in-production-never-commit-real-secrets
    ports:
      - "8001:8001"

volumes:
  user_pg_data:
  user_redis_data:
