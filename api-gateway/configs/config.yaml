server:
  port: 8000
  read_timeout_seconds: 15
  write_timeout_seconds: 15
  idle_timeout_seconds: 60
  cors_allowed_origins: ["*"]
  cors_allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  cors_allowed_headers: ["Origin", "Content-Type", "Accept", "Authorization", "X-Request-ID", "Idempotency-Key"]

auth:
  jwt_secret: "supersecretkeysharedacrossmicroservices2026"
  token_header: "Authorization"

redis:
  address: "localhost:6379"
  password: ""
  db: 0
  pool_size: 20

rate_limit:
  enabled: true
  policies:
    login:
      requests: 5
      window_seconds: 60
    search:
      requests: 100
      window_seconds: 60
    admin:
      requests: 100
      window_seconds: 60
    default:
      requests: 300
      window_seconds: 60

services:
  auth:
    name: "auth-service"
    prefix: "/api/v1/auth"
    target: "http://localhost:8001"
    timeout_seconds: 5
    require_auth: false

  user:
