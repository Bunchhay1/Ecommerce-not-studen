version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CONFIG_PATH=configs/config.yaml
      - REDIS_ADDR=gateway-redis:6379
      - JWT_SECRET=supersecretkeysharedacrossmicroservices2026
    depends_on:
      - gateway-redis
    networks:
      - ecommerce-network

  gateway-redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
