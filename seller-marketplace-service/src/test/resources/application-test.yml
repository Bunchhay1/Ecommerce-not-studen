spring:
  application:
    name: seller-marketplace-service-test

  datasource:
    url: jdbc:h2:mem:seller_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest

app:
  jwt:
    secret: supersecretjwtkeyfororderserviceauthvalidation2026!
  kafka:
    topics:
      seller-events: seller.events
      listing-events: listing.events
      marketplace-events: marketplace.events
      catalog-events: catalog.product.events
      order-events: order.events
      inventory-events: inventory.events
      review-events: review.events
