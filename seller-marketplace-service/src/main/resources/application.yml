server:
  port: ${SERVER_PORT:8014}
  servlet:
    context-path: /

spring:
  application:
    name: seller-marketplace-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5445}/${DB_NAME:seller_marketplace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6392}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:seller-marketplace-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  jwt:
    secret: ${JWT_SECRET:supersecretjwtkeyfororderserviceauthvalidation2026!}
  kafka:
    topics:
      seller-events: ${KAFKA_TOPIC_SELLER:seller.events}
      listing-events: ${KAFKA_TOPIC_LISTING:listing.events}
      marketplace-events: ${KAFKA_TOPIC_MARKETPLACE:marketplace.events}
      catalog-events: ${KAFKA_TOPIC_CATALOG:catalog.product.events}
      order-events: ${KAFKA_TOPIC_ORDERS:order.events}
      inventory-events: ${KAFKA_TOPIC_INVENTORY:inventory.events}
      review-events: ${KAFKA_TOPIC_REVIEWS:review.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
