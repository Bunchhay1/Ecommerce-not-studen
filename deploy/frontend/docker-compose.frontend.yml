version: '3.8'

services:
  customer-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ecommerce}/frontend:${VERSION:-latest}
    container_name: ecommerce-customer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - FRONTEND_TYPE=customer
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    networks:
      - ecommerce-net

  company-frontend:
    image: ${REGISTRY:-ecommerce}/frontend:${VERSION:-latest}
    container_name: ecommerce-company-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - FRONTEND_TYPE=company
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    external: true
