version: '3.8'

services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8087:8087"
    environment:
      - SERVER_PORT=8087
      - DB_HOST=postgres-order
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USER=order_user
      - DB_PASSWORD=order_password
      - REDIS_HOST=redis-order
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka-order:9092
      - KAFKA_TOPIC_ORDER_EVENTS=order.events
      - SERVICES_CART_URL=http://cart-service:8085
      - SERVICES_INVENTORY_URL=http://inventory-service:8086
      - SERVICES_USER_URL=http://user-service:8081
      - SERVICES_CATALOG_URL=http://catalog-service:8082
      - JWT_SECRET=supersecretjwtkeyfororderserviceauthvalidation2026!
      - JWT_ISSUER=auth-service
    depends_on:
      - postgres-order
      - redis-order
      - kafka-order
    networks:
      - ecommerce-network

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5438:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  redis-order:
    image: redis:7-alpine
    container_name: redis-order
    ports:
      - "6385:6379"
    networks:
      - ecommerce-network

  zookeeper-order:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper-order
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  kafka-order:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-order
    depends_on:
      - zookeeper-order
    ports:
      - "9098:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-order:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-order:29092,PLAINTEXT_HOST://localhost:9098
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-network

volumes:
  postgres_order_data:

networks:
  ecommerce-network:
    driver: bridge
