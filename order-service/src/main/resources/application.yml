server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5438}/${DB_NAME:order_db}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6385}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9098}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_GROUP_ID:order-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order.events}
  jwt:
    secret: ${JWT_SECRET:supersecretjwtkeyfororderserviceauthvalidation2026!}
    issuer: ${JWT_ISSUER:auth-service}
  cache:
    order-ttl-seconds: 600
  services:
    cart-url: ${SERVICES_CART_URL:http://localhost:8085}
    inventory-url: ${SERVICES_INVENTORY_URL:http://localhost:8086}
    user-url: ${SERVICES_USER_URL:http://localhost:8081}
    catalog-url: ${SERVICES_CATALOG_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.order: DEBUG
    org.springframework.security: INFO
