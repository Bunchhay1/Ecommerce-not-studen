[project]
name = "recommendation-service"
version = "0.1.0"
description = "Recommendation Service for E-Commerce Marketplace"
requires-python = ">=3.11"

[tool.pyrefly]
search-path = [
    ".",
    "app",
    ".venv/lib/python3.14/site-packages"
]
site-package-path = [
    ".venv/lib/python3.14/site-packages"
]
project-includes = [
    "app/**/*.py",
    "migrations/**/*.py",
    "tests/**/*.py"
]

[tool.pyright]
venv = ".venv"
venvPath = "."
extraPaths = [
    ".",
    "app",
    ".venv/lib/python3.14/site-packages"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
