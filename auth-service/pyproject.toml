[project]
name = "auth-service"
version = "0.1.0"
description = "Identity & Authentication Service"
requires-python = ">=3.11"

[tool.pyrefly]
search-path = [
    ".",
    ".venv/lib/python3.14/site-packages"
]

[tool.pyright]
venv = ".venv"
venvPath = "."
extraPaths = [
    ".",
    ".venv/lib/python3.14/site-packages"
]
